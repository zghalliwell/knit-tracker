<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Knit Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #1c1a17;
    --panel: #2a2724;
    --panel2: #34302b;
    --ink: #efe9e0;
    --dim: #a99f92;
    --accent: #d9a441;
    --done: #4c7a4c;
    --line: #423d37;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  #app { max-width: 620px; margin: 0 auto; padding: 12px 12px 40px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .meta { font-size: 12px; color: var(--dim); }
  .ver { font-size: 12px; color: var(--dim); font-weight: 500; }
  .wakebtn { width: 100%; text-align: center; padding: 14px; font-size: 15px; }
  .wakebtn b { color: var(--accent); }
  .syncline { font-size: 12px; color: var(--dim); margin: 2px 2px 8px; text-align: center; }
  .syncline.ok { color: #6db56d; }
  .syncline.warn { color: #e6683c; font-weight: 700; }
  .syncline.info { color: var(--dim); }

  .bar { background: var(--panel); border-radius: 10px; padding: 8px 10px; margin: 8px 0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prog-track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 120px; }
  .prog-fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
  .prog-label { font-size: 12px; color: var(--dim); white-space: nowrap; }

  select, .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .btn:active { background: var(--line); }

  .section-tag { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 14px 2px 4px; }

  .rowcard { background: var(--panel); border-radius: 14px; padding: 14px; }
  .rowhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .rowhead .label { font-size: 20px; font-weight: 700; }
  .rowhead .count { font-size: 13px; color: var(--dim); }
  .rep-flag { font-size: 12px; color: var(--accent); }
  .color-strip { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    font-size: 16px; font-weight: 700; background: var(--panel2); border-radius: 12px; padding: 12px 14px; }
  .color-strip .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); flex: none; }

  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px; min-height: 88px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; user-select: none; position: relative; text-align: center; }
  .step:active { transform: scale(.98); }
  .step.done { background: var(--done); border-color: var(--done); color: #eafaea; }
  .step .main { display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 600; }
  .step .plain { font-size: 14px; font-weight: 400; opacity: .68; }
  .step .cnt { font-size: 20px; font-weight: 700; background: rgba(0,0,0,.28); border-radius: 24px; padding: 4px 14px; }
  .step.group.done .cnt { background: rgba(0,0,0,.2); }

  .note { margin-top: 12px; font-size: 13px; color: var(--dim); background: var(--panel2);
    border-radius: 8px; padding: 8px 10px; }

  .controls { display: flex; gap: 10px; margin: 14px 0; }
  .controls .btn { flex: 1; text-align: center; padding: 22px; font-size: 19px; font-weight: 600; border-radius: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #201a0d; font-weight: 700; }

  .peek { background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--dim); margin: 8px 0; }
  .peek b { color: var(--ink); font-weight: 600; }

  .counters { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
  .counter { background: var(--panel); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
  .counter .cname { font-size: 15px; color: var(--dim); flex: 1; }
  .counter .cval { font-size: 30px; font-weight: 800; min-width: 48px; text-align: center; }
  .counter .cbtn { width: 68px; height: 68px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--ink); font-size: 34px; line-height: 1; }
  .counter .cbtn:active { background: var(--line); }

  .done-screen { text-align: center; padding: 40px 10px; }
  .done-screen h2 { color: var(--accent); }
  .small { font-size: 12px; color: var(--dim); }
</style>

/* ============================================================
   STORAGE LAYER  (hybrid: instant localStorage + GAS server)
   Every change saves to localStorage now and to your GAS web app
   (debounced). Each save is timestamped; on load, newest wins.
   ============================================================ */
let syncState = "", syncLevel = "info";
function setSync(s, level) {
  syncState = s; syncLevel = level || "info";
  const el = document.getElementById("syncStatus");
  if (el) { el.textContent = s; el.className = "syncline " + syncLevel; }
}
function serverConfigured() { return typeof GAS_URL === "string" && GAS_URL.indexOf("http") === 0; }
function shortTime() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

function readLocal() {
  try { const s = localStorage.getItem("knitState"); return s ? JSON.parse(s) : null; }
  catch (e) { return null; }
}
function writeLocal(obj) {
  try { localStorage.setItem("knitState", JSON.stringify(obj)); } catch (e) {}
}
// Returns: an object (data), null (reachable but empty), or undefined (unreachable/unreadable).
async function readServer() {
  if (!serverConfigured()) return null;
  try {
    const r = await fetch(GAS_URL, { method: "GET" });
    const t = (await r.text()).trim();
    return t ? JSON.parse(t) : null;
  } catch (e) { return undefined; }
}
// POST the state, then read it back and confirm the timestamp matches. The
// read-back is the real proof GAS stored it (the POST reply is not readable
// cross-origin, so we do not rely on it).
async function writeServer(obj) {
  if (!serverConfigured()) return;
  const stamp = obj.savedAt;
  try {
    await fetch(GAS_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(obj)
    });
  } catch (e) {
    setSync("SAVE FAILED - on device only", "warn");
    return;
  }
  const srv = await readServer();
  if (srv && srv.savedAt === stamp) setSync("saved " + shortTime(), "ok");
  else if (srv === undefined) setSync("saved on device, server unconfirmed", "warn");
  else setSync("server did not confirm the save", "warn");
}

let saveTimer = null;
function saveState(obj) {
  obj.savedAt = Date.now();
  writeLocal(obj);              // instant, always
  if (serverConfigured()) {
    setSync("saving...", "info");
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => writeServer(obj), 1200); // debounce bursts of taps
  }
}

/* ============================================================
   ENGINE
   ============================================================ */
// Flatten sections -> ordered list of rows, expanding row-level
// repeats is handled at JSON-gen time, so here we just flatten.
const flat = [];
PATTERN.sections.forEach(sec => {
  sec.rows.forEach(r => {
    flat.push({
      section: sec.name,
      label: r.label,
      note: r.note || null,
      count: (r.count !== undefined) ? r.count : null,
      rep: r.rep || null, // {label, i, total} optional display tag
      color: r.color || null, // {tag, name, hex} optional
      steps: r.steps.map(s => typeof s === "string"
        ? { text: s, times: 1 }
        : { text: s.group, times: s.times || 1, group: true })
    });
  });
});
const totalRows = flat.length;

// section start indices for the jump menu
const sectionStarts = {};
flat.forEach((r, i) => { if (!(r.section in sectionStarts)) sectionStarts[r.section] = i; });

// state is loaded asynchronously in boot(): compare local + server, newest wins.
let state = null;
let history = []; // {pos, stepIndex} in-session undo

function makeDefault() {
  return {
    pos: 0,
    stepDone: flat[0].steps.map(() => 0),
    counters: [ { name: "Counter A", val: 0 }, { name: "Counter B", val: 0 } ],
    wakeOn: false,
    savedAt: 0
  };
}
function normalize(s) {
  if (!s) return makeDefault();
  if (typeof s.pos !== "number" || s.pos < 0 || s.pos > totalRows) s.pos = 0;
  if (!Array.isArray(s.stepDone)) s.stepDone = flat[s.pos].steps.map(() => 0);
  if (!Array.isArray(s.counters)) s.counters = [ { name: "Counter A", val: 0 }, { name: "Counter B", val: 0 } ];
  if (typeof s.wakeOn === "undefined") s.wakeOn = false;
  if (typeof s.savedAt !== "number") s.savedAt = 0;
  return s;
}

function persist() { saveState(state); }

async function boot() {
  const local = readLocal();
  setSync(serverConfigured() ? "checking server..." : "on device only", "info");
  const server = await readServer();
  const reachable = server !== undefined;
  const serverData = server || null;
  const lt = (local && local.savedAt) || 0;
  const st = (serverData && serverData.savedAt) || 0;
  let chosen, source;
  if (serverData && st >= lt) { chosen = serverData; source = "server"; }
  else if (local) { chosen = local; source = "local"; }
  else { chosen = null; source = "new"; }
  state = normalize(chosen);
  if (state.wakeOn) wakeState = "paused (tap a stitch)";
  writeLocal(state); // make local match the winner
  render();
  if (serverConfigured()) {
    if (!reachable) setSync("server unreachable - using device copy", "warn");
    else if (source === "server") setSync("synced " + shortTime(), "ok");
    else saveState(state); // push local/new up, with confirmation
  }
}

function rowComplete() {
  const row = flat[state.pos];
  return row.steps.every((s, i) => state.stepDone[i] >= s.times);
}

function tapStep(i) {
  const row = flat[state.pos];
  if (state.stepDone[i] >= row.steps[i].times) return;
  state.stepDone[i]++;
  history.push({ pos: state.pos, stepIndex: i });
  if (rowComplete()) advance();
  persist(); render();
  if (state.wakeOn && !wakeActive) keepAwake(); // stitch tap carries activation
}

function advance() {
  if (state.pos < totalRows - 1) {
    state.pos++;
    state.stepDone = flat[state.pos].steps.map(() => 0);
  } else {
    state.pos = totalRows; // done sentinel
  }
}

function undo() {
  const last = history.pop();
  if (!last) return;
  if (last.pos !== state.pos) {
    // we had advanced past that row; step back and restore it as full
    state.pos = last.pos;
    state.stepDone = flat[state.pos].steps.map(s => s.times);
  }
  if (state.stepDone[last.stepIndex] > 0) state.stepDone[last.stepIndex]--;
  persist(); render();
}

function jumpTo(idx) {
  state.pos = idx;
  state.stepDone = flat[idx].steps.map(() => 0);
  history = [];
  persist(); render();
}

function bumpCounter(i, d) {
  state.counters[i].val = Math.max(0, state.counters[i].val + d);
  persist(); render();
}

/* ============================================================
   WAKE LOCK
   ============================================================ */
const WAKE_WEBM = "data:video/webm;base64,GkXfo59ChoEBQveBAULygQRC84EIQoKEd2VibUKHgQJChYECGFOAZwEAAAAAAAPgEU2bdLpNu4tTq4QVSalmU6yBoU27i1OrhBZUrmtTrIHYTbuMU6uEElTDZ1OsggEeTbuMU6uEHFO7a1OsggPK7AEAAAAAAABZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAVSalmsirXsYMPQkBNgI1MYXZmNjAuMTYuMTAwV0GNTGF2ZjYwLjE2LjEwMESJiECPQAAAAAAAFlSua8GuAQAAAAAAADjXgQFzxYjUD7xOH49OAJyBACK1nIN1bmSIgQCGhVZfVlA5g4EBI+ODhAJiWgDgibCBQLqBQJqBAhJUw2dAgHNzoGPAgGfImkWjh0VOQ09ERVJEh41MYXZmNjAuMTYuMTAwc3PaY8CLY8WI1A+8Th+PTgBnyKVFo4dFTkNPREVSRIeYTGF2YzYwLjMxLjEwMiBsaWJ2cHgtdnA5Z8ihRaOIRFVSQVRJT05Eh5MwMDowMDowMS4wMDAwMDAwMDAAH0O2dUIg54EAo6OBAACAgkmDQgAD8AP2ADgkHBhCAAAwYAAAZz///1mvETuzAKOTgQAoAIYAQJKcAElAAAMgAABUcKOTgQBQAIYAQJKcAErAAAMgAABUcKOTgQB4AIYAQJKcAEnAAAMgAABUcKOTgQCgAIYAQJKcAEigAAMgAABUcKOTgQDIAIYAQJKcAEeAAAMgAABUcKOTgQDwAIYAQJKcAEbgAAMgAABUcKOTgQEYAIYAQJKcAEZAAAMgAABUcKOTgQFAAIYAQJKcAEXAAAMgAABUcKOTgQFoAIYAQJKcAEVAAAMgAABUcKOTgQGQAIYAwJKcAEHAAAMgAABUcKOTgQG4AIYAQJKcAETgAAMgAABUcKOTgQHgAIYAQJKcAERgAAMgAABUcKOTgQIIAIYAQJKcAEQAAAMgAABUcKOTgQIwAIYAQJKcAEOgAAMgAABUcKOTgQJYAIYAQJKcAENAAAMgAABUcKOTgQKAAIYAQJKcAEMAAAMgAABUcKOTgQKoAIYAQJKcAELAAAMgAABUcKOTgQLQAIYAQJKcAEKAAAMgAABUcKOTgQL4AIYAQJKcAEJAAAMgAABUcKOTgQMgAIYAwJKcAEAgAAMgAABUcKOTgQNIAIYAQJKcAEIAAAMgAABUcKOTgQNwAIYAQJKcAEHgAAMgAABUcKOTgQOYAIYAQJKcAEHAAAMgAABUcKOTgQPAAIYAQJKcAEGAAAMgAABUcBxTu2uRu4+zgQC3iveBAfGCAaTwgQM=";
const WAKE_MP4 = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAOIbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAArJ0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAEAAAABAAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAIqbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAyAAAAMgBVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAAB1W1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAZVzdGJsAAAAuXN0c2QAAAAAAAAAAQAAAKlhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAEAAQABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAL2F2Y0MBQsAe/+EAF2dCwB7ZBCbARAAAAwAEAAADAMg8WLkgAQAFaMuDyyAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAb+AAAG/gAAAAYc3R0cwAAAAAAAAABAAAAGQAAAgAAAAAUc3RzcwAAAAAAAAABAAAAAQAAABxzdHNjAAAAAAAAAAEAAAABAAAAGQAAAAEAAAB4c3RzegAAAAAAAAAAAAAAGQAAAo8AAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAUc3RjbwAAAAAAAAABAAADuAAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAAOHbWRhdAAAAnEGBf//bdxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTI1IHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAAFmWIhAzyYoAAsLycnJ1111111111114AAAAGQZo4GeEYAAAABkGaVAZ4RgAAAAZBmmAzwjAAAAAGQZqAM8IwAAAABkGaoDPCMAAAAAZBmsAzwjAAAAAGQZrgM8IwAAAABkGbADPCMAAAAAZBmyAzwjAAAAAGQZtAM8IwAAAABkGbYDPCMAAAAAZBm4AzwjAAAAAGQZugM8IwAAAABkGbwDPCMAAAAAZBm+AzwjAAAAAGQZoAM8IwAAAABkGaIDPCMAAAAAZBmkAzwjAAAAAGQZpgM8IwAAAABkGagDPCMAAAAAZBmqAzwjAAAAAGQZrAL8IwAAAABkGa4C/CMAAAAAZBmwArwjA=";
let wakeLock = null, wakeVideo = null, wakeActive = false, wakeState = "off";

function setWake(s) {
  wakeState = s;
  const el = document.getElementById("wakeStatus");
  if (el) el.textContent = s;
}

function makeWakeVideo() {
  if (wakeVideo) return wakeVideo;
  const v = document.createElement("video");
  v.muted = true; v.defaultMuted = true; v.loop = true;
  v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
  v.setAttribute("loop", ""); v.setAttribute("autoplay", "");
  v.style.cssText = "position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;";
  // iOS plays the mp4 (H.264); list it first.
  const a = document.createElement("source"); a.src = WAKE_MP4; a.type = "video/mp4";
  const b = document.createElement("source"); b.src = WAKE_WEBM; b.type = "video/webm";
  v.appendChild(a); v.appendChild(b);
  v.addEventListener("timeupdate", () => { if (v.currentTime > 0.5) v.currentTime = 0; });
  document.body.appendChild(v);
  wakeVideo = v; return v;
}

// The wake lock must be requested from a direct element tap (button click or a
// stitch tap), which is what iOS accepts as user activation. It is never called
// from a passive document listener.
async function keepAwake() {
  if (wakeActive) return;
  let lockErr = null;
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeActive = true; setWake("on");
      wakeLock.addEventListener("release", () => {
        wakeActive = false;
        setWake((state && state.wakeOn) ? "paused (tap a stitch)" : "off");
      });
      return;
    } else { lockErr = "no wakeLock API"; }
  } catch (e) { lockErr = (e && e.name) ? e.name : String(e); }
  // Last-resort fallback (unreliable on modern iOS).
  try { await makeWakeVideo().play(); wakeActive = true; setWake("on (video; lock: " + lockErr + ")"); }
  catch (e) { setWake("blocked (lock: " + lockErr + ")"); }
}

function releaseWake() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
  if (wakeVideo) { try { wakeVideo.pause(); } catch (e) {} }
  wakeActive = false;
  setWake("off");
}

function toggleWake() {
  state.wakeOn = !state.wakeOn;
  persist();
  if (state.wakeOn) keepAwake(); else releaseWake();
}

// Returning to the app releases the lock; re-acquire if the user wants it on.
// If this needs a fresh tap, the status says "paused (tap a stitch)".
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state && state.wakeOn && !wakeActive) keepAwake();
});

/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById("app");

function render() {
  if (state.pos >= totalRows) { renderDone(); return; }
  const row = flat[state.pos];
  const pct = Math.round((state.pos / totalRows) * 100);

  const sectionOptions = Object.keys(sectionStarts)
    .map(n => `<option value="${sectionStarts[n]}">${n}</option>`).join("");

  const stepsHtml = row.steps.map((s, i) => {
    const done = state.stepDone[i] >= s.times;
    const counter = s.times > 1 ? `<span class="cnt">${state.stepDone[i]}/${s.times}</span>` : "";
    const pl = plain(s.text);
    const plainLine = (pl !== s.text) ? `<span class="plain">${escapeHtml(pl)}</span>` : "";
    return `<div class="step ${s.group ? "group" : ""} ${done ? "done" : ""}" onclick="tapStep(${i})">
      <span class="main">${escapeHtml(s.text)}${counter}</span>${plainLine}</div>`;
  }).join("");

  const next = flat[state.pos + 1];
  const peekHtml = next ? `<div class="peek">Next: <b>${escapeHtml(next.label)}</b> &nbsp;
    ${next.steps.map(s => escapeHtml(typeof s.text === "string" ? s.text : "")).join(", ")}</div>` : "";

  const countersHtml = state.counters.map((c, i) => `
    <div class="counter">
      <span class="cname">${escapeHtml(c.name)}</span>
      <button class="cbtn" onclick="bumpCounter(${i},-1)">-</button>
      <span class="cval">${c.val}</span>
      <button class="cbtn" onclick="bumpCounter(${i},1)">+</button>
    </div>`).join("");

  app.innerHTML = `
    <header>
      <h1>${escapeHtml(PATTERN.project)} <span class="ver">v${APP_VERSION}</span></h1>
      <span class="meta">${escapeHtml(PATTERN.meta.needles || "")}</span>
    </header>
    <div class="bar"><button class="btn wakebtn" onclick="toggleWake()">Keep screen awake: <b id="wakeStatus">${escapeHtml(wakeState)}</b></button></div>
    <div class="syncline ${syncLevel}" id="syncStatus">${escapeHtml(syncState)}</div>

    <div class="bar">
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="prog-label">Row ${state.pos + 1} of ${totalRows} &middot; ${pct}%</span>
    </div>

    <div class="bar">
      <span class="prog-label">Jump to</span>
      <select onchange="jumpTo(parseInt(this.value))">${sectionOptions}</select>
      <button class="btn" onclick="resetSection()">Reset section</button>
    </div>

    <div class="section-tag">${escapeHtml(row.section)}</div>

    <div class="rowcard">
      <div class="rowhead">
        <span class="label">${escapeHtml(row.label)}
          ${row.rep ? `<span class="rep-flag">(${escapeHtml(row.rep.label)} ${row.rep.i}/${row.rep.total})</span>` : ""}
        </span>
        ${row.count !== null ? `<span class="count">${row.count} sts</span>` : ""}
      </div>
      ${row.color ? `<div class="color-strip"><span class="dot" style="background:${row.color.hex}"></span>${escapeHtml(row.color.tag)} &middot; ${escapeHtml(row.color.name)}</div>` : ""}
      <div class="steps">${stepsHtml}</div>
      ${row.note ? `<div class="note">${escapeHtml(row.note)}</div>` : ""}
    </div>

    ${peekHtml}

    <div class="controls">
      <button class="btn" onclick="undo()">Undo</button>
      <button class="btn primary" onclick="advance();persist();render();">Skip row</button>
    </div>

    <div class="counters">${countersHtml}</div>
    <p class="small">Screen stays awake after your first tap. Your place is saved on this device.</p>
  `;
}

function resetSection() {
  const start = sectionStarts[flat[state.pos].section];
  jumpTo(start);
}

function renderDone() {
  app.innerHTML = `<div class="done-screen">
    <h2>Project complete</h2>
    <p>${escapeHtml(PATTERN.project)} is finished.</p>
    <button class="btn primary" onclick="jumpTo(0)">Start over</button>
  </div>`;
}

// Translate knitting abbreviations to plain English.
// Ordered: multi-letter terms first so they win over single letters.
const GLOSSARY = [
  [/\bM1L\b/gi, "make 1 left"],
  [/\bM1R\b/gi, "make 1 right"],
  [/\bm1\b/gi, "make 1"],
  [/\bk2tog\b/gi, "knit 2 together"],
  [/\bp2tog\b/gi, "purl 2 together"],
  [/\bssk\b/gi, "slip slip knit"],
  [/\bkfb\b/gi, "knit front and back"],
  [/\byo\b/gi, "yarn over"],
  [/\bpsso\b/gi, "pass slipped stitch over"],
  [/\btbl\b/gi, "through back loop"],
  [/\bwyib\b/gi, "with yarn in back"],
  [/\bwyif\b/gi, "with yarn in front"],
  [/\bslm\b/gi, "slip marker"],
  [/\bsl(\d+)\b/gi, "slip $1"],
  [/\bsl\b/gi, "slip"],
  [/\bpm\b/gi, "place marker"],
  [/\bCO\b/g, "cast on"],
  [/\bBO\b/g, "bind off"],
  [/\bk(\d+)\b/gi, "knit $1"],
  [/\bp(\d+)\b/gi, "purl $1"],
  [/\bk\b/gi, "knit"],
  [/\bp\b/gi, "purl"],
  [/\bsts\b/gi, "stitches"],
  [/\bst\b/gi, "stitch"],
  [/\bm\b/g, "marker"],
  [/\bRS\b/g, "right side"],
  [/\bWS\b/g, "wrong side"]
];
function plain(text) {
  let t = text;
  GLOSSARY.forEach(([re, rep]) => { t = t.replace(re, rep); });
  return t;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

boot();
</script>
